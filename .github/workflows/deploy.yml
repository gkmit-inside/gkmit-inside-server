name: CI/CD Pipeline

on:
  push:
    branches:
      - chore/github-action-setup

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        ref: chore/github-action-setup

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        script: |
          # Load NVM (Node installed via NVM)
          export NVM_DIR="$HOME/.nvm" 
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          # Ensure npm and pm2 are in PATH
          export PATH=$PATH:/usr/bin:/usr/local/bin
          cd /home/ubuntu/gkmit-inside-server
          git pull origin chore/github-action-setup
          npm install --production
          pm2 reload src/server.js || src/server.js
          pm2 save
